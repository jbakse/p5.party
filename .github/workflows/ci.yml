name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Record and Room tests need a deepstream server, so CI runs only the
      # unit tests. Run `npm run serve` + `npm test` locally for the full suite.
      - run: npm run test:unit
