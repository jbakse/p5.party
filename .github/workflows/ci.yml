name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # type-check the published declarations (types/p5.party.d.ts, made by build)
      - run: npm run test:types
      # Record, Room, and guestShareds tests need a deepstream server, so CI runs only the
      # unit tests. Run `npm run serve` + `npm test` locally for the full suite.
      - run: npm run test:unit
